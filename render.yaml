services:
  - type: web
    name: crossllm-mcp
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: AUTH_MODE
        value: oauth
      - key: RESOURCE_SERVER_URL
        sync: false
      - key: AUTH0_ISSUER
        sync: false
      - key: JWT_AUDIENCES
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: KIMI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
